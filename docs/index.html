<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVEWANSHI Milan — Policies</title>
<style>
  :root { --bg:#faf9f8; --ink:#241416; --muted:#6b5c5e; --crimson:#a41c2e; --crimson-deep:#7b1220; --line:#e8dfe0;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171112; --ink:#f0e6e7; --muted:#b9a6a8; --crimson:#e2596a; --crimson-deep:#c73b4d; --line:#372a2c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .wrap { max-width: 420px; padding: 40px 24px; text-align:center; }
  .mark { width: 44px; height: 44px; margin: 0 auto 18px; border: 3px solid var(--crimson); border-radius: 50%; position: relative; }
  .mark::after { content:""; position:absolute; left:18px; top:0; width:44px; height:44px; border:3px solid var(--crimson); border-radius:50%; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0 0 8px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  a.link { display:block; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-bottom:12px; text-decoration:none; color:var(--ink); font-weight:600; font-size:15px; text-align:left; }
  a.link span { display:block; font-weight:400; font-size:13px; color:var(--muted); margin-top:3px; }
  @media (prefers-color-scheme: dark) { a.link { background:#1f1719; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark" aria-hidden="true"></div>
  <h1>LOVEWANSHI Milan</h1>
  <p class="sub">Legal &amp; account pages</p>
  <a class="link" href="./privacy-policy.html">Privacy Policy<span>What we collect, why, and who sees it</span></a>
  <a class="link" href="./delete-account.html">Delete Your Account<span>Two ways — in-app or by email, no install needed</span></a>
</div>
</body>
</html>
