# ---------------------------------------------------------------------------
# nginx reverse proxy for the Gahoi Milan API.
#
# Install to /etc/nginx/sites-available/gahoi-milan and symlink into
# sites-enabled. Serves api.gahoimarriage.in.
#
# Why nginx at all, when Spring Boot can serve HTTP directly:
#   - Android blocks cleartext HTTP by default, so the API must be HTTPS, and
#     certbot renews certificates here without restarting the Java process
#   - Java never runs as root, so it cannot bind :443 itself
#   - Rate limiting and request size caps stop abusive traffic before it
#     reaches a 1 GB application server
# ---------------------------------------------------------------------------

# Throttle by client IP. Login and signup get a tighter bucket than the rest:
# they are the endpoints worth brute-forcing, and a real person signs in once,
# not five times a second. 10 MB of shared state holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.gahoimarriage.in;

    # certbot writes its challenge files here and must reach them over plain
    # HTTP, so this location is excluded from the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The `http2 on;` form needs nginx 1.25.1+. Ubuntu 24.04 ships 1.24, where
    # it is an unknown directive and the whole config fails to load - so HTTP/2
    # goes on the listen line instead. That form still works on newer nginx,
    # it only logs a deprecation notice.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gahoimarriage.in;

    # Written by: sudo certbot --nginx -d api.gahoimarriage.in
    ssl_certificate     /etc/letsencrypt/live/api.gahoimarriage.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gahoimarriage.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tell browsers never to try HTTP again. Harmless for the native app,
    # valuable the moment there is a web front end.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Photo uploads. Spring caps a single file at 8 MB; this sits just above so
    # nginx does not reject a request the app would have accepted with a
    # readable error.
    client_max_body_size 12M;
    client_body_timeout 60s;

    access_log /var/log/nginx/gahoi-milan.access.log;
    error_log  /var/log/nginx/gahoi-milan.error.log warn;

    # Auth endpoints: 1 request/second, bursting to 5.
    location ~ ^/api/v1/auth/(login|signup|google) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;

        # Spring reads these to reconstruct the original scheme and host.
        # Without X-Forwarded-Proto the app believes requests are plain HTTP
        # and issues http:// redirects that Android then refuses.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Uploads over a phone connection are slow; the 60s default cuts them
        # off mid-transfer on a weak signal.
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Health check, kept out of the access log so it does not drown real
    # traffic, and not rate limited so a monitor cannot lock itself out.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        access_log off;
    }
}
