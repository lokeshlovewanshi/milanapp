# Production profile. Values come from /etc/lovewanshi-milan/lovewanshi-milan.env,
# which the deploy workflow writes from GitHub secrets and systemd hands to
# the JVM. Activated with: --spring.profiles.active=prod

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# `none`, not `validate`: validate compares every column's exact JDBC type and
# refuses to start on cosmetic differences - tinyint vs integer for a column
# holding 1-3, for example - which blocks deploys for no runtime benefit. Never
# `update`: letting Hibernate alter a production schema on boot is how columns
# get silently dropped.
#
# The trade: a genuine mismatch (a renamed or missing column) now surfaces as a
# failing request instead of a failed startup. Worth re-enabling `validate` on
# a staging box before a release that changes entities.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=NATIVE
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.tomcat.max-threads=100
server.error.include-stacktrace=never
server.error.include-message=never

security.jwt.secret-key=${JWT_SECRET}
# 180 days by default. Override with JWT_EXPIRATION (ms) in the secret or the
# server's env file if a shorter session is ever needed for one deployment.
security.jwt.expiration-time=${JWT_EXPIRATION:15552000000}

aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket.name=${AWS_S3_BUCKET:lovewanshi-milan-photos}

# --- Support contact -------------------------------------------------------
#
# Shown on Help & Support in the app. Here rather than in the app so changing
# the support number is a restart, not a Play Store release.
support.contact.phone=${SUPPORT_CONTACT_PHONE:7676554631}
support.contact.email=${SUPPORT_CONTACT_EMAIL:lovewanshisamaj@gmail.com}

# --- CloudFront (photo delivery) -------------------------------------------
#
# Photos are served through CloudFront so egress lands in its permanently-free
# 1 TB/month rather than S3's per-GB rate. All three must be set for signing to
# switch on; with any of them blank the app falls back to S3 presigned URLs and
# logs which mode it chose at startup. See CloudFrontUrlSigner.
cloudfront.domain=${CLOUDFRONT_DOMAIN:}
cloudfront.key-pair-id=${CLOUDFRONT_KEY_PAIR_ID:}
# Prefer the path on a server: systemd's EnvironmentFile does not preserve the
# escaped newlines an inline PEM needs.
cloudfront.private-key-path=${CLOUDFRONT_PRIVATE_KEY_PATH:}
cloudfront.private-key=${CLOUDFRONT_PRIVATE_KEY:}
cloudfront.url-ttl-seconds=${CLOUDFRONT_URL_TTL_SECONDS:3600}

google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:dummyClientId}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:dummySecret}
spring.security.oauth2.client.registration.google.redirect-uri=${API_BASE_URL:http://localhost:8080}/api/v1/auth/grantcode

firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.enabled=${FIREBASE_ENABLED:false}
notifications.admin-secret=${NOTIFICATIONS_ADMIN_SECRET:LovewanshiAdmin2026SecureSecret!}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=WARN
logging.level.com.match.partner=INFO
logging.file.name=/var/log/lovewanshi-milan/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Email (OTP for address verification and password reset) ---------------
#
# These live HERE, not in application.properties, because that file is
# gitignored and never reaches the jar. Putting the mail block there shipped a
# build whose EmailService required a JavaMailSender that Spring had no reason
# to create - MailSenderAutoConfiguration is conditional on spring.mail.host -
# and the context failed to start. A feature nobody had configured yet took the
# whole API down.
#
# spring.mail.host therefore keeps a default: the bean must exist even with no
# credentials, so that "email is not set up" stays a disabled feature rather
# than a dead application.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.trust=*
# Without these a dead SMTP host hangs the request thread until the OS gives
# up, turning "email is down" into "the API is down".
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:noreply@lovewanshisamaj.in}
app.mail.from-name=${MAIL_FROM_NAME:Lovewanshi Parinay}

# Never let SMTP decide whether the API is healthy. This one line was also
# stranded in the gitignored file; without it the mail health indicator opens
# an SMTP connection on every /actuator/health and reports DOWN when there are
# no credentials, which fails the deploy's own health gate. See build.gradle.
management.health.mail.enabled=false

# --- External Lambdas ------------------------------------------------------
kundali.enabled=${KUNDALI_ENABLED:false}
welcome-email.function-name=${WELCOME_EMAIL_FUNCTION_NAME:lovewanshi-milan-welcome-email}
welcome-email.enabled=${WELCOME_EMAIL_ENABLED:false}
