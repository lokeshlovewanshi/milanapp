# Local development profile, run with: --spring.profiles.active=local
#
# Mirrors application-prod.properties' shape (same keys, ${VAR:default}
# pattern) so the two stay easy to compare, but every default here targets
# your own machine - a local MySQL instance and a Cloudflare Tunnel standing
# in for the load balancer. Safe to commit: nothing here is a real secret.
#
# Real per-developer secrets (AWS keys, mail credentials, Google OAuth client
# ID, the Firebase service-account path) still come from the gitignored
# application.properties sitting alongside this file - Spring loads that one
# as the base layer and this profile on top of it, so those values keep
# working unchanged. This file only needs to declare what should differ for
# local dev specifically.

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3308/marriage_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:lovewanshi_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
management.health.mail.enabled=false

# `none`, matching prod - see the comment there. A local schema drift should
# fail loudly (a bad query) rather than have Hibernate silently alter your
# dev database on every restart.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

server.port=${SERVER_PORT:8080}

security.jwt.secret-key=${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890}
security.jwt.expiration-time=${JWT_EXPIRATION:15552000000}

# CORS defaults to "*" (see CorsConfig) when this is unset, which already
# covers a browser hitting the tunnel hostname - no override needed here.

# Louder than prod's WARN, so a request routed in through the tunnel is
# actually visible while you're watching the terminal.
logging.level.root=INFO
logging.level.com.match.partner=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# AWS S3 (credentials provided via environment)
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket.name=${AWS_S3_BUCKET:lovewanshi-milan-photos}
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}

# Disable remote Lambda / Firebase calls on local
kundali.enabled=false
welcome-email.enabled=false
firebase.enabled=false
