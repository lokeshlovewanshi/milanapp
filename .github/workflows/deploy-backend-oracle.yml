name: Deploy backend (Oracle prod)

on:
  push:
    branches: [main, fresh-dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-oracle.yml"
  workflow_dispatch:

env:
  BACKEND_DIR: backend/lovewanshi-milan-api-feature-h-sijariya
  VM_HOST: "155.248.244.90"

concurrency:
  group: deploy-backend-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build the jar
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test --no-daemon

      - name: Deploy to Oracle Cloud Always Free VM
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${ORACLE_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::GitHub secret 'ORACLE_SSH_PRIVATE_KEY' is not set"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%b\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy

          JAR=$(ls -t ${{ env.BACKEND_DIR }}/build/libs/*.jar | grep -v -- '-plain' | head -1)
          echo "Uploading $JAR to ${{ env.VM_HOST }}..."

          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_deploy \
              "$JAR" ubuntu@${{ env.VM_HOST }}:/tmp/app.jar

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/oracle_deploy \
              ubuntu@${{ env.VM_HOST }} bash -se <<'REMOTE'
            set -eu
            sudo mv /tmp/app.jar /opt/lovewanshi-milan/app.jar
            sudo chown ubuntu:ubuntu /opt/lovewanshi-milan/app.jar
            sudo chmod 644 /opt/lovewanshi-milan/app.jar
            sudo systemctl restart lovewanshi-milan
          REMOTE

          echo "Waiting for backend health check on http://${{ env.VM_HOST }}/actuator/health..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://${{ env.VM_HOST }}/actuator/health" 2>/dev/null | grep -q UP; then
              echo "::notice::Backend successfully deployed and healthy on Oracle VM!"
              exit 0
            fi
            sleep 3
          done

          echo "::error::Health check timed out."
          exit 1
