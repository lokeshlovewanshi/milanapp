name: Deploy backend (Oracle prod)

on:
  push:
    branches: [prd, dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-oracle.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev or prd)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prd

env:
  BACKEND_DIR: backend/lovewanshi-milan-api-feature-h-sijariya
  FALLBACK_VM_HOST: "155.248.244.90"

concurrency:
  group: deploy-backend-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.environment ||
        github.ref == 'refs/heads/prd' && 'prd' ||
        'dev'
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build the jar
        working-directory: backend/lovewanshi-milan-api-feature-h-sijariya
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test --no-daemon

      - name: Deploy to Oracle Cloud Always Free VM
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_VM_HOSTS: ${{ secrets.ORACLE_VM_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${ORACLE_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::GitHub secret 'ORACLE_SSH_PRIVATE_KEY' is not set"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%b\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy

          JAR=$(ls -t ${{ env.BACKEND_DIR }}/build/libs/*.jar | grep -v -- '-plain' | head -1)
          TARGETS="${ORACLE_VM_HOSTS:-${{ env.FALLBACK_VM_HOST }}}"
          TARGETS="${TARGETS//,/ }"

          for VM_HOST in $TARGETS; do
            echo "Uploading $JAR to $VM_HOST..."
            scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_deploy \
              "$JAR" "ubuntu@$VM_HOST:/tmp/app.jar"

            ssh -o StrictHostKeyChecking=no -i ~/.ssh/oracle_deploy \
              "ubuntu@$VM_HOST" bash -se <<'REMOTE'
              set -eu
              sudo mv /tmp/app.jar /opt/lovewanshi-milan/app.jar
              sudo chown ubuntu:ubuntu /opt/lovewanshi-milan/app.jar
              sudo chmod 644 /opt/lovewanshi-milan/app.jar
              sudo systemctl restart lovewanshi-milan
          REMOTE

            echo "Waiting for backend health check on http://$VM_HOST/actuator/health..."
            healthy=false
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 "http://$VM_HOST/actuator/health" 2>/dev/null | grep -q UP; then
                healthy=true
                break
              fi
              sleep 3
            done

            if [ "$healthy" != true ]; then
              echo "::error::Health check timed out for $VM_HOST."
              exit 1
            fi
            echo "::notice::Backend successfully deployed and healthy on $VM_HOST."
          done
