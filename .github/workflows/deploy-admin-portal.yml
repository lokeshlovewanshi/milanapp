name: Deploy Admin Portal

on:
  push:
    branches: [dev, prd]
    paths:
      - "admin-portal/**"
      - ".github/workflows/deploy-admin-portal.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev or prd)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prd

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy admin portal
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.environment ||
        github.ref == 'refs/heads/prd' && 'prd' ||
        'dev'
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json

      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_PORTAL_BUCKET: ${{ vars.ADMIN_PORTAL_BUCKET }}
          ADMIN_PORTAL_DISTRIBUTION_ID: ${{ vars.ADMIN_PORTAL_DISTRIBUTION_ID }}
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
          AWS_GITHUB_DEPLOY_ROLE_ARN: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
        run: |
          test -n "${AWS_REGION}"
          test -n "${ADMIN_PORTAL_BUCKET}"
          test -n "${ADMIN_PORTAL_DISTRIBUTION_ID}"
          test -n "${ADMIN_API_BASE_URL}"
          test -n "${AWS_GITHUB_DEPLOY_ROLE_ARN}"

      - name: Install dependencies and build
        working-directory: admin-portal
        env:
          VITE_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          role-session-name: milanapp-admin-portal-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload static files and refresh CloudFront
        working-directory: admin-portal
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_PORTAL_BUCKET: ${{ vars.ADMIN_PORTAL_BUCKET }}
          ADMIN_PORTAL_DISTRIBUTION_ID: ${{ vars.ADMIN_PORTAL_DISTRIBUTION_ID }}
        run: |
          aws s3 sync dist "s3://${ADMIN_PORTAL_BUCKET}" --delete --exclude "index.html" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${ADMIN_PORTAL_BUCKET}/index.html" --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "${ADMIN_PORTAL_DISTRIBUTION_ID}" --paths "/*"
