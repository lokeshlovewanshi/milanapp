name: Deploy Admin Portal

on:
  push:
    branches: [dev, prd]
    paths:
      - "admin-portal/**"
      - ".github/workflows/deploy-admin-portal.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev or prd)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prd

permissions:
  contents: read

concurrency:
  group: deploy-admin-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy admin portal
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.environment ||
        github.ref == 'refs/heads/prd' && 'prd' ||
        'dev'
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json

      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_PORTAL_BUCKET: ${{ vars.ADMIN_PORTAL_BUCKET }}
          ADMIN_PORTAL_DISTRIBUTION_ID: ${{ vars.ADMIN_PORTAL_DISTRIBUTION_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          test -n "${AWS_REGION}"
          test -n "${ADMIN_PORTAL_BUCKET}"
          test -n "${ADMIN_PORTAL_DISTRIBUTION_ID}"
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"

      - name: Install dependencies and build
        working-directory: admin-portal
        env:
          VITE_API_BASE_URL: https://api.lovewanshisamaj.in
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3 & Invalidate CloudFront
        working-directory: admin-portal
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_PORTAL_BUCKET: ${{ vars.ADMIN_PORTAL_BUCKET }}
          ADMIN_PORTAL_DISTRIBUTION_ID: ${{ vars.ADMIN_PORTAL_DISTRIBUTION_ID }}
        run: |
          node deploy-s3.mjs
